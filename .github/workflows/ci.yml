name: ci

# One workflow, so there is one thing to require. Branch protection should
# require only `ci-success`: it fails if any job below failed, was cancelled or
# was skipped. No path filters (a filtered check is simply absent on a PR that
# does not touch its paths), and no cloud credentials.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Secret scan over the whole git history, with a pinned and checksummed
  # release of the tool. `.env` is git-ignored; this is the backstop.
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: gitleaks (full history)
        run: |
          set -euo pipefail
          ver=8.30.1
          sha=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tar.gz" "https://github.com/gitleaks/gitleaks/releases/download/v${ver}/gitleaks_${ver}_linux_x64.tar.gz"
          echo "${sha}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --log-opts="--all" .

  # A workflow that fails to parse produces no checks at all, so CI can look
  # green while dead. actionlint fails loudly on that.
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: actionlint
        run: |
          set -euo pipefail
          ver=1.7.12
          sha=8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          curl -fsSL -o "$RUNNER_TEMP/actionlint.tar.gz" "https://github.com/rhysd/actionlint/releases/download/v${ver}/actionlint_${ver}_linux_amd64.tar.gz"
          echo "${sha}  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

  test:
    runs-on: ubuntu-latest
    # A throwaway Postgres for the tests that store a call. It exists for the
    # length of this job and holds nothing but test rows.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: clinic
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: clinic_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clinic -d clinic_test"
          --health-interval 2s --health-timeout 2s --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql://clinic:ci-only@localhost:5432/clinic_test
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  # The browser page (React and TypeScript, web/). `npm ci` installs exactly what the
  # lockfile says and fails if package.json disagrees with it. The audit covers what
  # ships to the browser, and fails on high severity; the build tools are not audited
  # here (see docs/VERIFICATION.md for the one known advisory in the linter).
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  # Whole conversations against the real model, scripted and simulated callers,
  # graded on what the gateway and the clinic's records show. Model-graded and
  # therefore not perfectly repeatable, so the gate is a rule, not equality:
  # every scenario marked critical must be safe in every run, and 90% overall
  # must pass. Needs the OPENAI_API_KEY repository secret; without it the job
  # fails rather than skipping, because a skipped required check can read as
  # passed. Pull requests from forks do not get the secret and so cannot pass.
  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: evals
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$OPENAI_API_KEY" || { echo "::error::OPENAI_API_KEY is not set for this run"; exit 1; }
          uv run python -m evals.run --repeat 3 --gate 0.9
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: eval-results
          path: evals/reports/
          retention-days: 14
          if-no-files-found: ignore

  # The single required check. `if: always()` is load-bearing: without it a
  # failed job would make this one skip, and a skipped required check can read
  # as passed. Add every new job to `needs`; a unit test fails if one is missing.
  ci-success:
    needs: [gitleaks, actionlint, test, web, evals]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' >/dev/null; then
            echo "all required jobs succeeded"
          else
            echo "::error::one or more required jobs did not succeed"
            exit 1
          fi
