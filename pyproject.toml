[project]
name = "clinic-voice-agent"
version = "0.1.0"
description = "A multilingual phone receptionist for a fictional physiotherapy clinic, built on LiveKit Agents"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    # Pinned exactly. The agent framework moves fast, and an upgrade should be
    # a decision with a test run behind it, not something a fresh install does.
    "livekit-agents[deepgram,elevenlabs,openai,silero]==1.8.12",
    "aiohttp>=3.9",
    "psycopg[binary]>=3.2",
    "pydantic>=2.10",
    "pydantic-settings>=2.13.1",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pyjwt>=2.8",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pyyaml>=6.0",
    "ruff>=0.15.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clinic_voice_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]  # so tests can import the eval runner

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S603", "S607"]
"scripts/*" = ["ASYNC109", "ASYNC240", "S603", "S607"]
"evals/compare_pipelines.py" = ["ASYNC240", "S603", "S607"]
# What the receptionist says is sentences, long by nature; wrapping them would only hide them.
"src/clinic_voice_agent/locales.py" = ["E501"]
"tests/unit/test_locales.py" = ["E501"]
