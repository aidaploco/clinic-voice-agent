# Everything runs on this machine; nothing here costs money or runs in a cloud (the speech and
# model services you call are the only things that are billed).
#
#   docker compose up -d db      just the database, for running the worker and page natively
#   docker compose up --build    the database, the worker and the page at http://127.0.0.1:8765
#   docker compose down          stop (add -v to delete the data too)
#
# `worker` and `web` need the keys in `.env` (copy `.env.example`). They are passed in as
# environment variables, never built into the image.
x-app: &app
  image: clinic-voice-agent:local
  build: .
  env_file: .env
  environment: &app-environment
    # The host's .env points at the database on 127.0.0.1; from inside the network it is `db`.
    DATABASE_URL: postgresql://clinic:clinic-local-only@db:5432/clinic
  volumes:
    - ./recordings:/app/recordings
  depends_on:
    db:
      condition: service_healthy

services:
  worker:
    <<: *app
    command: ["python", "-m", "clinic_voice_agent.worker", "start"]
    environment:
      <<: *app-environment
      # Empty: no traces. `TRACE_ENDPOINT=http://phoenix:6006 docker compose --profile traces up`
      # sends them, with personal data left out, to the Phoenix below.
      TRACE_ENDPOINT: ${TRACE_ENDPOINT:-}

  web:
    <<: *app
    command: ["python", "-m", "clinic_voice_agent.web"]
    environment:
      <<: *app-environment
      # Inside the container the server listens on all of its addresses; the port is published
      # below on this machine's 127.0.0.1 only, so nobody else on the network can reach it.
      WEB_HOST: 0.0.0.0
    ports:
      - "127.0.0.1:${WEB_PORT:-8765}:8765"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8765/')"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Traces of a call, for looking at where its time went. Off unless asked for:
  #   TRACE_ENDPOINT=http://phoenix:6006 docker compose --profile traces up --build
  # then http://127.0.0.1:6007. What it receives has had personal data removed (tracing.py).
  phoenix:
    profiles: ["traces"]
    image: arizephoenix/phoenix:version-16.0.0
    ports:
      - "127.0.0.1:6007:6006"
    volumes:
      - phoenix-data:/mnt/data

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: clinic
      POSTGRES_PASSWORD: clinic-local-only
      POSTGRES_DB: clinic
    ports:
      # Bound to this machine only, on a port that will not clash with another Postgres.
      - "127.0.0.1:54329:5432"
    volumes:
      - clinic-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinic -d clinic"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  clinic-db:
  phoenix-data:
