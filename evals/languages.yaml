# The receptionist's lines in each language, for measuring speech services (scripts/language_probe.py)
# and, later, for the conversations in each language.
#
# Spanish, Dutch and Bosnian were drafted for measurement and reviewed by the owner, a native
# speaker of all three, on 2026-11-16. One correction: in Bosnian, half hours are "pola" the next
# hour ("pola jedanaest" is 10:30), not "deset i trideset". Times are written out in words, as the voice is
# given them (no digit-and-colon times), and there are no numerals, so a transcript can be compared
# word for word. `numeric` lists the sentences (by position, from 0) that carry numbers. A transcript
# may write "nine" or 9, "half elf" or 10:30, and all are right, so those are shown as heard for a
# person to read and not scored; the rest are scored on their words.
en:
  reviewed: true
  numeric: [3, 4, 6]
  sentences:
    - "Thank you for calling Quillbrook Physio. This is Emily, the clinic's automated receptionist."
    - "May I have your full name, please?"
    - "Thanks. And your date of birth, please? Say the day, month and year."
    - "I can offer you Tuesday at ten thirty in the morning, Wednesday at four thirty in the afternoon, or Thursday at nine in the morning."
    - "I'll move your shoulder physiotherapy with Doctor Okafor from tomorrow at three thirty in the afternoon to Friday at nine in the morning. Is that right?"
    - "Your appointment is now confirmed. Is there anything else I can help you with?"
    - "Alex Rivera, born the fourteenth of March, nineteen ninety."
    - "I'm sorry, I can't hear you properly. Please try calling again. Goodbye."
es:
  reviewed: true
  numeric: [3, 4, 6]
  sentences:
    - "Gracias por llamar a Quillbrook Physio. Soy Emily, la recepcionista automática de la clínica."
    - "¿Me puede dar su nombre completo, por favor?"
    - "Gracias. ¿Y su fecha de nacimiento, por favor? Dígame el día, el mes y el año."
    - "Le puedo ofrecer el martes a las diez y media de la mañana, el miércoles a las cuatro y media de la tarde, o el jueves a las nueve de la mañana."
    - "Voy a cambiar su fisioterapia de hombro con el doctor Okafor de mañana a las tres y media de la tarde al viernes a las nueve de la mañana. ¿Es correcto?"
    - "Su cita ya está confirmada. ¿Hay algo más en lo que le pueda ayudar?"
    - "Alex Rivera, nacido el catorce de marzo de mil novecientos noventa."
    - "Lo siento, no logro escucharle bien. Por favor, intente llamar de nuevo. Adiós."
nl:
  reviewed: true
  numeric: [3, 4, 6]
  sentences:
    - "Bedankt voor het bellen naar Quillbrook Physio. U spreekt met Emily, de automatische receptioniste van de praktijk."
    - "Mag ik uw volledige naam, alstublieft?"
    - "Dank u. En uw geboortedatum, alstublieft? Zegt u de dag, de maand en het jaar."
    - "Ik kan u dinsdag om half elf 's ochtends aanbieden, woensdag om half vijf 's middags, of donderdag om negen uur 's ochtends."
    - "Ik verplaats uw schoudertherapie bij dokter Okafor van morgen half vier 's middags naar vrijdag negen uur 's ochtends. Klopt dat?"
    - "Uw afspraak is nu bevestigd. Kan ik nog iets anders voor u doen?"
    - "Alex Rivera, geboren op veertien maart negentienhonderd negentig."
    - "Het spijt me, ik kan u niet goed horen. Probeert u het later nog eens. Tot ziens."
bs:
  reviewed: true
  numeric: [3, 4, 6]
  sentences:
    - "Hvala što ste nazvali Quillbrook Physio. Ja sam Emily, automatska recepcionerka klinike."
    - "Možete li mi reći svoje puno ime, molim vas?"
    - "Hvala. A vaš datum rođenja, molim vas? Recite dan, mjesec i godinu."
    - "Mogu vam ponuditi utorak u pola jedanaest ujutro, srijedu u pola pet poslijepodne, ili četvrtak u devet sati ujutro."
    - "Pomjerit ću vašu fizioterapiju ramena kod doktora Okafora sa sutra u pola četiri poslijepodne na petak u devet sati ujutro. Je li to tačno?"
    - "Vaš termin je sada potvrđen. Mogu li vam još nešto pomoći?"
    - "Alex Rivera, rođen četrnaestog marta hiljadu devetsto devedesete."
    - "Žao mi je, ne čujem vas dobro. Molim vas, pokušajte nazvati ponovo. Doviđenja."
