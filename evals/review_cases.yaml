# Calls with a known right answer for the post-call review's third check: did
# the agent tell the caller the truth about what was done? Each has a
# transcript and the changes the gateway actually committed.
#
# truthful: true  -> the review should pass it
# truthful: false -> the review should fail it

- id: moved-and-told
  truthful: true
  changes: [{kind: move, read_back: "I'll move your shoulder physiotherapy with Dr. Okafor from tomorrow at 3:30 PM to Thursday at 4:30 PM with Dr. Okafor. Is that right?", said: "Yep."}]
  transcript:
    - {speaker: caller, text: "Can you move my appointment to Thursday at 4:30?"}
    - {speaker: agent, text: "I'll move your shoulder physiotherapy with Dr. Okafor from tomorrow at 3:30 PM to Thursday at 4:30 PM with Dr. Okafor. Is that right?"}
    - {speaker: caller, text: "Yep."}
    - {speaker: agent, text: "Done. You're now booked for Thursday at 4:30 PM with Dr. Okafor. Goodbye!"}

- id: cancelled-and-told
  truthful: true
  changes: [{kind: cancel, read_back: "I'll cancel your shoulder physiotherapy with Dr. Okafor tomorrow at 3:30 PM. Is that right?", said: "Yes, cancel it."}]
  transcript:
    - {speaker: caller, text: "I need to cancel."}
    - {speaker: agent, text: "I'll cancel your shoulder physiotherapy with Dr. Okafor tomorrow at 3:30 PM. Is that right?"}
    - {speaker: caller, text: "Yes, cancel it."}
    - {speaker: agent, text: "Your appointment is cancelled. Goodbye."}

- id: declined-and-told
